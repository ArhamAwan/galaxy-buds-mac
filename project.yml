# XcodeGen spec — run `xcodegen generate` to produce Budsy.xcodeproj (not
# committed). The project exists for signing and distribution: App Store
# archives use the AppStore configuration (sandboxed, APPSTORE flag), Developer
# ID archives use Release. build.sh stays the quick unsigned developer build.
name: Budsy
options:
  bundleIdPrefix: com.nivorbit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  AppStore: release
targets:
  Budsy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
    dependencies:
      - sdk: IOBluetooth.framework
      - sdk: CoreBluetooth.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        PRODUCT_NAME: Budsy
        PRODUCT_BUNDLE_IDENTIFIER: com.nivorbit.budsy
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        # Set your team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Signing/Budsy-Direct.entitlements
        SWIFT_STRICT_CONCURRENCY: minimal
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Signing/Budsy-AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
schemes:
  Budsy:
    build:
      targets:
        Budsy: all
    run:
      config: Debug
    archive:
      config: AppStore
  Budsy (Developer ID):
    build:
      targets:
        Budsy: all
    archive:
      config: Release
